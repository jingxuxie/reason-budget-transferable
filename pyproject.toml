[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-transferable-process-values"
version = "0.1.0"
description = "Compact deadline-dependent decisions and certified capped-rollout learning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "scikit-learn>=1.3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["budget_values*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
